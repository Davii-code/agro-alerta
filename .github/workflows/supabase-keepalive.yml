name: Supabase keepalive

# Projetos Supabase no plano free sao pausados depois de alguns dias sem
# atividade. Este workflow roda todos os dias: grava um batimento na tabela
# public.keepalive e, em seguida, executa a pipeline de ingestao, que escreve
# precos de mercado, snapshots de clima e risk_scores.
on:
  schedule:
    # 11:17 UTC = 08:17 em Brasilia. Minuto fora da hora cheia reduz a fila do
    # agendador do GitHub, que atrasa jobs marcados em :00.
    - cron: '17 11 * * *'
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Gravar batimento
    runs-on: ubuntu-latest
    steps:
      - name: Inserir linha em public.keepalive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY no repositorio."
            exit 1
          fi
          status=$(curl -sS -o /tmp/keepalive.out -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/keepalive" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"source\":\"github-actions\",\"note\":\"run ${GITHUB_RUN_ID}\"}")
          echo "HTTP ${status}"
          cat /tmp/keepalive.out
          # 2xx apenas. Qualquer outra coisa significa que o projeto esta
          # pausado, a chave expirou ou a migration 04 nao foi aplicada.
          case "$status" in
            2??) echo "Batimento gravado." ;;
            *) echo "::error::Keepalive falhou com HTTP ${status}"; exit 1 ;;
          esac

      - name: Limpar batimentos antigos
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sS -X POST "${SUPABASE_URL%/}/rest/v1/rpc/prune_keepalive" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

  ingestion:
    name: Pipeline de ingestao
    runs-on: ubuntu-latest
    needs: heartbeat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Rodar ingestion_pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python pipeline/ingestion_pipeline.py
